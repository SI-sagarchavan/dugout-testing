<!-- Shell for the React bundle. esbuild splices the compiled JS into the marker
     below — Figma only accepts a single self-contained UI file, so there is no
     second request to make. -->
<style>
  /* __FONTS__ */
  /* FanOS Surface. Colours are sampled from the Surface sign-in screen: a navy
     blue-black ground for dark, the cool off-white #f5f5f7 for light, and the
     indigo #5d52f6 as the one brand colour (primary buttons, active tab, avatar).
     The earlier gray palette in the design system artifact was measured from
     Figma's own window and is superseded here. Inter ships with Figma and
     JetBrains Mono is inlined below, so nothing is fetched. */
  :root, .figma-dark {
    --canvas: #0c0f1d;
    --surface: #131629;
    --surface-raised: #1a1d35;
    --surface-well: #23274a;
    --surface-chip: #2d3157;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --ink: #ffffff;
    --ink-muted: #a9adc8;
    --bound: #6ee0a8;
    --attention: #f1d372;
    --link: #9a93ff;
    --primary: #5d52f6;
    --primary-hover: #7268ff;
    --on-primary: #ffffff;
    --avatar-green: #5d52f6;
  }
  .figma-light {
    --canvas: #f5f5f7;
    --surface: #f9f9fb;
    --surface-raised: #ffffff;
    --surface-well: #ececf1;
    --surface-chip: #e2e2ea;
    --line: #e5e5e5;
    --line-strong: #c8c8d2;
    --ink: #0c0c14;
    --ink-muted: #656573;
    --bound: #1b7a3a;
    --attention: #8a5a00;
    --link: #4a3fe0;
    --primary: #5d52f6;
    --primary-hover: #4c41e4;
    --on-primary: #ffffff;
    --avatar-green: #5d52f6;
  }
  :root {
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-gutter: 14px;
    --radius-sm: 4px; --radius-md: 8px; --radius-full: 999px;
    --font-sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    /* The legacy names the asset and reconciliation panels were written against,
       pointed at the system so they pick the palette up without being rewritten. */
    --fos-bg: var(--canvas);
    --fos-bg-secondary: var(--surface-raised);
    --fos-bg-hover: var(--surface-well);
    --fos-text: var(--ink);
    --fos-text-secondary: var(--ink-muted);
    --fos-border: var(--line);
    --fos-brand: var(--primary);
    --fos-brand-text: var(--on-primary);
    --fos-danger: var(--attention);
    --fos-warn: var(--attention);
    --fos-success: var(--bound);
    --fos-card: var(--surface);
    --fos-card-border: var(--line);
    --fos-track: var(--surface-well);
    --fos-link: var(--link);
    --fos-radius: var(--radius-md);
    --fos-card-radius: var(--radius-md);
    --fos-font: var(--font-sans);
    --fos-mono: var(--font-mono);
    --fos-surface-2: var(--surface-well);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--canvas); color: var(--ink);
    font: 400 12.5px/19px var(--font-sans);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100%; display: flex; flex-direction: column; }
  h1, h2, p, ul { margin: 0; }
  ul { list-style: none; padding: 0; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  /* --- type ---------------------------------------------------------------- */
  .t-score { font: 600 24px/30px var(--font-sans); letter-spacing: -0.025em; }
  .t-title { font: 700 14px/20px var(--font-sans); letter-spacing: -0.01em; }
  .t-label { font: 600 12.5px/18px var(--font-sans); }
  .t-body { font: 400 12.5px/19px var(--font-sans); }
  .t-caption { font: 400 11.5px/16px var(--font-sans); }
  .t-overline { font: 700 10px/14px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; }
  .t-mono { font: 400 11px/14px var(--font-mono); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* --- shell ---------------------------------------------------------------- */
  .fs-top {
    position: relative;
    display: flex; align-items: stretch; gap: 6px; flex: 0 0 auto;
    padding: 0 10px 0 4px; border-bottom: 1px solid var(--line);
  }
  /* The account button: your initial when signed in, a person with a dot when not. */
  .fs-avatar-btn {
    position: relative; align-self: center; flex: none; width: 28px; height: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink);
    font: 600 11px/14px var(--font-sans); cursor: pointer;
  }
  .fs-avatar-btn:hover:not(:disabled) { background: var(--surface-well); }
  .fs-avatar-btn.is-in { background: var(--avatar-green); border-color: var(--avatar-green); color: var(--on-primary); }
  .fs-avatar-dot {
    position: absolute; top: -1px; right: -1px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--attention); border: 2px solid var(--canvas); box-sizing: content-box;
  }
  .fs-avatar-dot.is-busy { background: var(--link); animation: fs-pulse 1.2s ease-in-out infinite; }
  @keyframes fs-pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .fs-avatar-dot.is-busy { animation: none; } }
  .fs-pop-scrim { position: fixed; inset: 0; z-index: 9; }
  .fs-pop {
    position: absolute; z-index: 10; top: calc(100% + 4px); right: 8px; width: 244px;
    display: flex; flex-direction: column; gap: 8px; padding: 10px;
    background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  }
  .fs-select {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 6px;
    min-height: 26px; max-width: 100%; padding: 0 8px; border-radius: var(--radius-md);
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink);
    font: 500 12px/16px var(--font-sans); text-align: left; cursor: pointer;
  }
  .fs-select:hover:not(:disabled) { background: var(--surface-well); }
  .fs-select:disabled { cursor: default; color: var(--ink-muted); background: var(--surface-well); }
  .fs-select[aria-expanded="true"] { border-color: var(--line-strong); background: var(--surface-well); }
  .fs-select .is-placeholder { color: var(--ink-muted); }
  .fs-select-caret { flex: none; width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-muted); }
  .fs-select-list {
    position: fixed; z-index: 10; margin: 0; padding: 4px; list-style: none; overflow-y: auto; overflow-x: hidden;
    background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    outline: none;
  }
  .fs-select-opt {
    display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 8px 4px 4px; border-radius: 4px;
    font: 500 12px/16px var(--font-sans); color: var(--ink); cursor: pointer;
  }
  .fs-select-opt.is-active { background: var(--surface-chip); }
  .fs-select-tick { flex: none; width: 14px; display: inline-flex; justify-content: center; color: var(--ink); }
  .fs-pop-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .fs-tabs { flex: 1; display: flex; }
  .fs-tab {
    display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 10px;
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0;
    background: transparent; color: var(--ink-muted); font: 500 12px/16px var(--font-sans); cursor: pointer;
  }
  .fs-tab:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .fs-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); }
  .fs-count {
    display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: var(--radius-full); background: var(--attention); color: var(--canvas);
    font: 500 10px/14px var(--font-mono);
  }
  .fs-iconbtn {
    align-self: center; width: 28px; height: 28px; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-md); border: 1px solid var(--line);
    background: var(--surface-raised); color: var(--ink); cursor: pointer;
  }
  .fs-iconbtn:hover:not(:disabled) { background: var(--surface-well); }
  .fs-iconbtn.is-on { background: var(--surface-chip); }
  .fs-main {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--space-2);
    padding: var(--space-gutter); overflow-y: auto; overflow-x: hidden;
  }
  .fs-preview { padding: 0; gap: 0; overflow: hidden; }
  .fs-preview-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-bottom: 1px solid var(--line); font: 500 11px/16px var(--font-sans); color: var(--ink-muted);
  }
  .fs-preview-head strong { color: var(--ink); font-weight: 500; }
  .fs-preview-scroll {
    max-height: 220px; overflow-y: auto; overflow-x: hidden; background: var(--surface-well);
  }
  .fs-preview-scroll img { display: block; width: 100%; height: auto; }
  .fs-foot {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    padding: var(--space-2) var(--space-gutter) var(--space-gutter); border-top: 1px solid var(--line); background: var(--canvas);
  }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* --- controls ------------------------------------------------------------- */
  .fs-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 30px; padding: 0 12px; border-radius: var(--radius-md);
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink);
    font: 500 12px/16px var(--font-sans); white-space: nowrap; cursor: pointer;
  }
  .fs-btn:hover:not(:disabled):not([aria-disabled="true"]) { background: var(--surface-well); }
  .fs-btn:disabled, .fs-btn[aria-disabled="true"] { cursor: default; opacity: 1; background: var(--surface-well); color: var(--ink-muted); }
  .fs-btn.is-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .fs-btn.is-primary:hover:not(:disabled):not([aria-disabled="true"]) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .fs-btn.is-primary:disabled, .fs-btn.is-primary[aria-disabled="true"] { background: var(--surface-well); border-color: var(--surface-well); color: var(--ink-muted); }
  .fs-btn.is-text { background: none; border-color: transparent; color: var(--link); padding: 0 6px; min-height: 26px; }
  .fs-btn.is-text:hover:not(:disabled) { background: var(--surface-well); }
  .fs-btn.is-text:disabled { background: none; color: var(--ink-muted); opacity: 0.6; }
  .fs-btn.is-compact { min-height: 26px; padding: 0 10px; }
  .fs-seg {
    align-self: flex-start; display: inline-flex; gap: 2px; padding: 3px; flex: none;
    border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--line);
  }
  .fs-segitem {
    display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px;
    border: 0; border-radius: var(--radius-full); background: transparent; color: var(--ink-muted);
    font: 500 12px/16px var(--font-sans); cursor: pointer;
  }
  .fs-segitem:hover:not(:disabled):not([aria-selected="true"]) { background: transparent; color: var(--ink); }
  .fs-segitem[aria-selected="true"] { background: var(--surface-chip); color: var(--ink); }
  .fs-segitem .fs-pill { background: var(--surface-well); }

  /* --- surfaces ------------------------------------------------------------- */
  .fs-card {
    display: flex; flex-direction: column; gap: 10px; padding: var(--space-3); flex: none;
    border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line);
  }
  .fs-card.is-list { gap: 0; padding: 0 var(--space-3); background: var(--surface-raised); }
  .fs-row {
    display: flex; flex-direction: column; flex: none; border-radius: var(--radius-md);
    background: var(--surface-raised); border: 1px solid var(--line); overflow: hidden;
  }
  .fs-row.is-open { border-color: var(--line-strong); }
  .fs-row.is-quiet { background: transparent; border-style: dashed; }
  .fs-row-head { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 7px 7px 7px 10px; }
  .fs-row-hit {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left;
    border: 0; border-radius: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  }
  .fs-row-hit:hover:not(:disabled) { background: none; }
  .fs-row .fs-btn:not(.is-primary):not(.is-text), .fs-row .fs-iconbtn { background: var(--surface-well); }
  .fs-row .fs-btn:hover:not(:disabled):not(.is-primary):not(.is-text) { background: var(--surface-chip); }
  .fs-well {
    flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-md); background: var(--surface-well); border: 1px solid var(--line-strong); color: var(--ink);
    font: 500 11px/14px var(--font-mono);
  }
  .fs-rowbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .fs-line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .fs-val { font: 500 12px/16px var(--font-mono); }
  .fs-pill {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-full);
    background: var(--surface-chip); color: var(--ink); font: 400 10px/14px var(--font-mono); white-space: nowrap;
  }
  .fs-de {
    display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: var(--radius-sm);
    background: var(--surface-chip); color: var(--ink); font: 400 10px/14px var(--font-mono);
  }
  .fs-tag {
    display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: var(--radius-full);
    background: var(--surface-chip); color: var(--ink); font: 400 11px/14px var(--font-sans); white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .fs-status { display: inline-flex; align-items: center; gap: 5px; font: 500 10px/14px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .fs-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .fs-bar { height: 6px; border-radius: 3px; background: var(--surface-well); overflow: hidden; flex: none; }
  .fs-bar > span { display: block; height: 100%; background: var(--bound); transition: width 0.3s ease; }
  .fs-bar.is-link > span { background: var(--link); }
  .fs-bar.is-thin { height: 3px; }
  /* Indeterminate: a frame mid-upload has no honest percentage, because the files
     go out in one request. A sliding segment says "working" and nothing more. */
  .fs-bar.is-busy > span { width: 35%; animation: fs-slide 1.2s ease-in-out infinite; }
  @keyframes fs-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .fs-bar.is-busy > span { animation: none; width: 100%; opacity: 0.5; } }
  .fs-stat { font: 500 13px/16px var(--font-mono); }
  .fs-item { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 0; }
  .fs-item + .fs-item { border-top: 1px solid var(--line); }
  .fs-item.is-wrap { flex-wrap: wrap; row-gap: 10px; }
  .fs-mark { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
  .fs-avatar {
    width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%;
    background: var(--avatar-green); color: var(--on-primary); font: 600 11px/14px var(--font-sans);
  }
  .fs-disclose {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 34px; padding: 0; border: 0; border-radius: 0; background: none; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .fs-disclose:hover:not(:disabled) { background: none; }
  .fs-empty { padding: 16px var(--space-3); text-align: center; }
  .fs-banner { flex: 0 0 auto; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface); color: var(--attention); font: 400 12px/16px var(--font-sans); }

  /* --- an open queue row --------------------------------------------------- */
  .fs-body { margin: 0 10px; padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .fs-hint { color: var(--ink-muted); font: 400 11px/16px var(--font-sans); }
  .cand {
    display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 6px 8px; margin: 0;
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); text-align: left; font-weight: 400;
  }
  .cand:hover:not(:disabled) { background: var(--surface-well); }
  .cand-on { background: var(--surface-well); border-color: var(--line-strong); }
  .cand .radio, .cand .swatch { margin-top: 3px; }
  .cand-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .cand-ref { font: 500 11px/14px var(--font-mono); }
  .cand-evidence { display: flex; align-items: center; gap: 8px; min-width: 0; font: 400 11px/14px var(--font-mono); color: var(--ink-muted); }
  .cand-add { font: 500 10px/14px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--attention); }
  .radio { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; border: 1.5px solid var(--ink-muted); }
  .cand-on .radio { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--surface-well); background: var(--ink); }
  .cand .swatch { width: 14px; height: 14px; border-radius: 4px; }
  .hash { color: var(--ink-muted); }

  /* --- legacy: base controls the asset and reconciliation panels still use --- */
  button {
    font: inherit;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: var(--fos-radius);
    padding: 5px 10px;
    cursor: pointer;
    background: var(--fos-bg-secondary);
    color: var(--fos-text);
  }
  button:hover:not(:disabled) { background: var(--fos-bg-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  /* A commitment carries more weight than the label of a thing you might do. */
  button.primary {
    background: var(--fos-brand); color: var(--fos-brand-text); border-color: transparent;
    font-weight: 600;
  }
  button.outline { background: transparent; border-color: var(--fos-border); }
  button.ghost { background: transparent; border-color: transparent; color: var(--fos-text-secondary); padding: 3px 6px; }
  button.ghost:hover:not(:disabled) { color: var(--fos-text); background: var(--fos-bg-hover); }

  select {
    font: inherit;
    background: transparent;
    color: var(--fos-text);
    border: 1px solid var(--fos-border);
    border-radius: var(--fos-radius);
    padding: 3px 6px;
    max-width: 132px;
    flex: 0 0 auto;
  }

  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .muted { color: var(--fos-text-secondary); }
  /* Monospace runs optically larger than Inter at the same nominal size and
     tracks wider. Both are corrected here so a token sitting next to a label
     reads as the same size, which is the only reason to use ems for this. */
  .mono {
    font-family: var(--fos-mono);
    font-size: 0.94em;
    letter-spacing: -0.01em;
  }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .section { padding: 10px 14px; border-bottom: 1px solid var(--fos-border); }
  button.compact { padding: 3px 7px; }
  .loss { color: var(--fos-warn); font-variant-numeric: tabular-nums; }

  /* A text button that reads as a link, because that is what it is: Undo, and
     "select these on canvas". Neither is a commitment worth a filled rectangle. */
  button.link {
    background: transparent; border-color: transparent; color: var(--fos-link);
    padding: 0; font-weight: 500; flex: 0 0 auto;
  }
  button.link:hover:not(:disabled) { background: transparent; text-decoration: underline; }

  .dot { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }

  .person {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--fos-bg); border-radius: 999px;
    padding: 2px 7px 2px 2px; flex: 0 0 auto; max-width: 96px;
    line-height: 1;
  }
  .person-mine { box-shadow: inset 0 0 0 1px var(--fos-border); }
  .person-bare { padding: 0; background: transparent; max-width: none; }
  .person-initial {
    width: 16px; height: 16px; border-radius: 999px;
    color: #fff; font-size: 8px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .person-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: var(--fos-t-small); font-weight: 600;
  }

  /* Pinned to the top at a fixed 44px rather than centred in whatever height the
     window happens to be. If a resize doesn't take, this reads as a compact bar
  /* --- legacy: assets -------------------------------------------------- */
  .asset-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--fos-border);
  }
  .asset-row:last-child { border-bottom: none; }

  /* Fixed box, so rows do not reflow as thumbnails land one at a time. The
     checkerboard reads through a transparent PNG, which is most of them. */
  .thumb {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 3px;
    overflow: hidden;
    background-color: var(--fos-surface-2, rgba(128, 128, 128, 0.12));
    background-image:
      linear-gradient(45deg, rgba(128, 128, 128, 0.22) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(128, 128, 128, 0.22) 25%, transparent 25%),
