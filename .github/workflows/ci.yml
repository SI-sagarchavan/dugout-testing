name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness" --health-interval 3s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["56379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The whole eval path against the scripted model: no API key, no cost.
      - run: pnpm eval match-preview --scripted
