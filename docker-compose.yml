# The databases, in Docker. The apps run on the host with pnpm (`pnpm worker`, `pnpm dev`).
#
# One Postgres+pgvector server holds both databases: `harness` (dugout's memory and runs) and `fanos`
# (the pipeline's control plane, with its own role). One Valkey (no-eviction, like prod streams)
# holds dugout's event stream in database 0 and the pipeline's job queue in database 1. Host ports
# are offset (55432, 56379) so they don't clash with a local Postgres or Redis; both can be moved
# with DUGOUT_PG_PORT and DUGOUT_VALKEY_PORT.
#
# Profiles:
#   pipeline  Electric, the control plane's live sync (`pnpm infra up pipeline`)
#   temporal  parked: `docker compose --profile temporal up -d`.
name: dugout
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    # Electric reads the WAL through logical replication. The default `wal_level=replica` carries no
    # row images, so shapes would come up empty with no error anywhere. Changing it restarts the server.
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    ports: ["${DUGOUT_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the `fanos` role and database when the data directory is new; on an existing server
      # run scripts/pipeline-db.sh
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["${DUGOUT_VALKEY_PORT:-56379}:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 20

  # Postgres -> HTTP sync for the board. Never exposed to browsers: the API proxies it.
  pipeline-electric:
    profiles: [pipeline]
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgres://fanos:fanos@postgres:5432/fanos
      ELECTRIC_INSECURE: "true" # local only
    ports: ["${PIPELINE_ELECTRIC_PORT:-3010}:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal:
    profiles: [temporal]
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"] # gRPC, UI
    volumes: [temporaldata:/data]
volumes:
  pgdata:
  valkeydata:
  temporaldata:
