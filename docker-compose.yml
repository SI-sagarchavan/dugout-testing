# Local infra for the harness: Postgres+pgvector, Valkey (no-eviction, like prod streams), Temporal dev server.
name: fanos-agents
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 20
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"] # gRPC, UI
    volumes: [temporaldata:/data]
volumes:
  pgdata:
  valkeydata:
  temporaldata:
