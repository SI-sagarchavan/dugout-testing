<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -140 2670 1476" width="2670" height="1476"><rect x="-20" y="-140" width="100%" height="100%" fill="white"/><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#495057"/></marker></defs><text x="0" y="-92" font-size="28" font-family="Helvetica" text-anchor="start" fill="#1e1e1e">One Handoff run, end to end: who does what, in order</text><rect x="0" y="-62" width="215" height="36" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="107.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">outside / client</text><rect x="230" y="-62" width="215" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="337.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">service or infra</text><rect x="460" y="-62" width="215" height="36" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="567.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">workflow (code path)</text><rect x="690" y="-62" width="215" height="36" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="797.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">agent (model loop)</text><rect x="920" y="-62" width="215" height="36" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="1027.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">a person</text><rect x="1150" y="-62" width="215" height="36" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="1257.5" y="-39.125" font-size="13" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">memory / context (dashed)</text><rect x="0" y="-14" width="2630" height="124" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="126" width="2630" height="124" rx="8" fill="#f1f3f5" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="266" width="2630" height="124" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="406" width="2630" height="124" rx="8" fill="#f1f3f5" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="546" width="2630" height="124" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="686" width="2630" height="124" rx="8" fill="#f1f3f5" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="826" width="2630" height="124" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="966" width="2630" height="96" rx="8" fill="#f1f3f5" stroke="#dee2e6" stroke-width="2"/><rect x="0" y="0" width="150" height="84" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="75" y="38.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Figma + FanXP</text><text x="75" y="56" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">backend + S3</text><rect x="0" y="140" width="150" height="84" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="75" y="178.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Worker</text><text x="75" y="196" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">(run machinery)</text><rect x="0" y="280" width="150" height="84" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="75" y="318.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">section-builder</text><text x="75" y="336" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">WORKFLOW (code)</text><rect x="0" y="420" width="150" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="75" y="458.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">frame-match</text><text x="75" y="476" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">AGENT</text><rect x="0" y="560" width="150" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="75" y="598.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">data-bind +</text><text x="75" y="616" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">hook-maker AGENTS</text><rect x="0" y="700" width="150" height="84" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="75" y="738.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">People</text><text x="75" y="756" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">(Surface Studio)</text><rect x="0" y="840" width="150" height="84" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="75" y="878.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Memory +</text><text x="75" y="896" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">context</text><rect x="0" y="980" width="150" height="70" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="75" y="1020.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Guardrails</text><rect x="170" y="0" width="210" height="84" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="275" y="38.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Designer presses</text><text x="275" y="56" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Handoff in Figma</text><rect x="420" y="0" width="210" height="84" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="525" y="29.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Files to S3, SHA-256</text><text x="525" y="47.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">checked; Handoff</text><text x="525" y="64.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">received; run queued</text><rect x="2420" y="0" width="210" height="84" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="2525" y="29.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Publish template;</text><text x="2525" y="47.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">renderer shows live</text><text x="2525" y="64.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Cast data, no agent</text><rect x="670" y="140" width="210" height="84" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="775" y="178.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Claim run, hold lease,</text><text x="775" y="196" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">save point each step</text><rect x="920" y="140" width="1460" height="84" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text x="1650" y="178.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Every step: events go to Valkey + run_events (Studio watches live).</text><text x="1650" y="196" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">A question or write pauses the run; a crash resumes from the last save point.</text><rect x="670" y="280" width="210" height="84" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="775" y="309.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Start workflow: no</text><text x="775" y="327.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">approval, $3 budget</text><text x="775" y="344.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">for the whole run</text><rect x="920" y="280" width="210" height="84" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1025" y="318.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Run frame-match</text><text x="1025" y="336" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">(up to 3 tries)</text><rect x="1170" y="280" width="210" height="84" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1275" y="309.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Branch on slots:</text><text x="1275" y="327.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">0-1: one bind, or none</text><text x="1275" y="344.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">2+: check Cast budget</text><rect x="2170" y="280" width="210" height="84" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="2275" y="301" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Merge slot plans, check</text><text x="2275" y="318.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">tree, publish once.</text><text x="2275" y="336" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Output: one preview +</text><text x="2275" y="353.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">what's still off</text><rect x="920" y="420" width="210" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="1025" y="449.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Compile IR, render,</text><text x="1025" y="467.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">measure vs screenshot.</text><text x="1025" y="484.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Fix; keep what helps</text><rect x="1420" y="560" width="210" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="1525" y="589.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">bind: choose source,</text><text x="1525" y="607.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">build plan, bind.try</text><text x="1525" y="624.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">checks it</text><rect x="1670" y="560" width="210" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="1775" y="589.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">hook-maker: find a</text><text x="1775" y="607.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">dugout_ hook in Cast;</text><text x="1775" y="624.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">build one if none fits</text><rect x="1920" y="560" width="210" height="84" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="2025" y="589.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">bind.publish: bound,</text><text x="2025" y="607.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">stand-in or none,</text><text x="2025" y="624.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">per slot</text><rect x="920" y="700" width="210" height="84" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="1025" y="729.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Asked what the frame</text><text x="1025" y="747.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">can't show (layout,</text><text x="1025" y="764.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">section split)</text><rect x="1170" y="700" width="210" height="84" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="1275" y="729.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Asked which slots to</text><text x="1275" y="747.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">bind if Cast's hourly</text><text x="1275" y="764.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">runs fall short</text><rect x="1670" y="700" width="210" height="84" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="1775" y="729.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Approves each hook</text><text x="1775" y="747.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">build (a write); may</text><text x="1775" y="764.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">request a change</text><rect x="2420" y="700" width="210" height="84" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="2525" y="729.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Reviews preview,</text><text x="2525" y="747.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">approves, places it</text><text x="2525" y="764.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">in Layout Builder</text><rect x="670" y="840" width="210" height="84" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="775" y="869.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Run start: pinned facts,</text><text x="775" y="887.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">skills, approved lessons,</text><text x="775" y="904.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">date, thread notes</text><rect x="920" y="840" width="210" height="84" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="1025" y="869.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Load tool reads this</text><text x="1025" y="887.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">section: decisions,</text><text x="1025" y="904.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">builds, lessons</text><rect x="1170" y="840" width="210" height="84" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="1275" y="869.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">Answers kept: decision</text><text x="1275" y="887.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">per section, proposed</text><text x="1275" y="904.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">fact for the club</text><rect x="2420" y="840" width="210" height="84" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text x="2525" y="869.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">After run: build records;</text><text x="2525" y="887.25" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">consolidation; next run</text><text x="2525" y="904.75" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">reads them</text><rect x="170" y="980" width="2460" height="70" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="1400" y="1011.5" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">On every tool call: tenant id from run context only (row-level security) · input policy (no secrets, path traversal) · redactor on results ·</text><text x="1400" y="1029" font-size="14" font-family="Helvetica" text-anchor="middle" fill="#1e1e1e">typed tools only, writes need approval + a reason · MCP registry + lock · budgets (USD, steps, depth) · request compaction past 150k tokens</text><line x1="380" y1="42" x2="420" y2="42" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="630" y1="42" x2="670" y2="182" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="636" y="104" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">queue</text><line x1="775" y1="224" x2="775" y2="280" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="880" y1="322" x2="920" y2="322" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="1025" y1="364" x2="1025" y2="420" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="1130" y1="462" x2="1170" y2="322" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="1380" y1="322" x2="1525" y2="560" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="1460.5" y="455" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">per slot</text><line x1="1630" y1="602" x2="1670" y2="602" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="1880" y1="602" x2="1920" y2="602" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="2025" y1="560" x2="2275" y2="364" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><line x1="2275" y1="364" x2="2525" y2="700" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="2408" y="546" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">preview</text><line x1="2525" y1="700" x2="2525" y2="84" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="2533" y="406" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">approved</text><line x1="1025" y1="504" x2="1025" y2="700" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="1033" y="612" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">ask</text><line x1="1275" y1="364" x2="1275" y2="700" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="1283" y="586" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">ask</text><line x1="1775" y1="644" x2="1775" y2="700" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="1783" y="682" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">ask</text><line x1="1275" y1="784" x2="1275" y2="840" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="1283" y="822" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">learned</text><line x1="2525" y1="784" x2="2525" y2="840" stroke="#495057" stroke-width="2" marker-end="url(#m)"/><text x="2533" y="822" font-size="14" font-family="Helvetica" text-anchor="start" fill="#c92a2a">comments</text></svg>